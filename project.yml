name: KeigoButtonMac
options:
  bundleIdPrefix: com.core7.keigobutton
  # §17. Japanese is the base localization (CFBundleDevelopmentRegion), and the
  # three .lproj directories under App/Resources carry InfoPlist.strings — the
  # Accessibility prompt and the Finder name, which macOS draws from the bundle
  # rather than from our own `tr`.
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "4KS6YS23KT"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "1"
    # §2: the sandbox makes AXUIElementCreateSystemWide useless against other
    # processes, so this app can never ship on the Mac App Store.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_ENTITLEMENTS: App/Resources/KeigoButtonMac.entitlements
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  KeigoButtonMacCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3

targets:
  KeigoButtonMac:
    type: application
    platform: macOS
    # Supplies POSTHOG_PROJECT_TOKEN / POSTHOG_HOST to Info.plist's $() substitutions.
    # The tracked base optionally includes the ignored local override; the release
    # workflow passes production values on the xcodebuild command line, which wins.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
    dependencies:
      - package: KeigoButtonMacCore
        product: DesktopRewriteKit
      - package: KeigoButtonMacCore
        product: TextIO
      - package: Sparkle
        product: Sparkle
      - package: PostHog
        product: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.core7.keigobutton.mac
        # MUST stay ASCII. A non-ASCII PRODUCT_NAME makes the executable
        # `Contents/MacOS/敬語ボタン`, and Xcode's debug-dylib signing flow then skips
        # it — the bundle signing fails with "code object is not signed at all".
        # The user-visible name is CFBundleDisplayName in Info.plist.
        PRODUCT_NAME: KeigoButton
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
