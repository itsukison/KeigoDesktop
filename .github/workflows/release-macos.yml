name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: macos-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: production
    env:
      APP_NAME: KeigoButtonMac
      PROJECT: KeigoButtonMac.xcodeproj
      SCHEME: KeigoButtonMac
      TEAM_ID: 4KS6YS23KT
      BUNDLE_ID: com.core7.keigobutton.mac
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs and credentials
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must look like 0.1.0" >&2
            exit 1
          }
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_P12_PASSWORD"
          test -n "$APP_STORE_CONNECT_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$SPARKLE_PRIVATE_ED_KEY_BASE64"
          TAG="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Test
        run: swift test

      - name: Import Developer ID identity
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"
          test -n "$SIGNING_IDENTITY" || {
            echo "The p12 does not contain a valid Developer ID Application identity" >&2
            exit 1
          }
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notarization and Sparkle keys
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY_BASE64" | base64 --decode > "$SPARKLE_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH" "$SPARKLE_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_PATH=$SPARKLE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive and export
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/$APP_NAME.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist scripts/release/ExportOptions.plist
          APP_PATH="$EXPORT_PATH/$APP_NAME.app"
          test -d "$APP_PATH"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$DERIVED_DATA" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify exported application
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test "$(defaults read "$APP_PATH/Contents/Info" CFBundleIdentifier)" = "$BUNDLE_ID"
          test "$(defaults read "$APP_PATH/Contents/Info" CFBundleShortVersionString)" = "$VERSION"
          test "$(defaults read "$APP_PATH/Contents/Info" CFBundleVersion)" = "$BUILD_NUMBER"
          test "$(defaults read "$APP_PATH/Contents/Info" SUPublicEDKey)" = "$SPARKLE_PUBLIC_ED_KEY"
          ARCHITECTURES="$(lipo -archs "$APP_PATH/Contents/MacOS/$APP_NAME")"
          [[ " $ARCHITECTURES " == *" arm64 "* ]]
          [[ " $ARCHITECTURES " == *" x86_64 "* ]]
          ENTITLEMENTS="$(codesign -d --entitlements - "$APP_PATH" 2>/dev/null)"
          [[ "$ENTITLEMENTS" != *"com.apple.security.app-sandbox"* ]]
          [[ "$ENTITLEMENTS" != *"com.apple.security.get-task-allow"* ]]

      - name: Notarize and staple application
        run: |
          set -euo pipefail
          NOTARY_UPLOAD="$RUNNER_TEMP/$APP_NAME-notary.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_UPLOAD"
          xcrun notarytool submit "$NOTARY_UPLOAD" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --output-format json > "$RUNNER_TEMP/app-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/app-notary.json"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Package and notarize DMG
        run: |
          set -euo pipefail
          RELEASE_DIR="$RUNNER_TEMP/release"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          mkdir -p "$RELEASE_DIR" "$DMG_ROOT"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          UPDATE_ZIP="$RELEASE_DIR/$APP_NAME-$VERSION.zip"
          DMG_PATH="$RELEASE_DIR/$APP_NAME-$VERSION.dmg"
          ditto -c -k --keepParent "$APP_PATH" "$UPDATE_ZIP"
          hdiutil create \
            -volname "敬語ボタン" \
            -srcfolder "$DMG_ROOT" \
            -format UDZO \
            -ov \
            "$DMG_PATH"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "UPDATE_ZIP=$UPDATE_ZIP" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Generate signed appcast
        run: |
          set -euo pipefail
          SPARKLE_BIN="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin"
          GENERATE_APPCAST="$SPARKLE_BIN/generate_appcast"
          test -x "$GENERATE_APPCAST"
          APPCAST_DIR="$RUNNER_TEMP/appcast"
          mkdir -p "$APPCAST_DIR"
          cp "$UPDATE_ZIP" "$APPCAST_DIR/"
          NOTES_FILE="docs/releases/$VERSION.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            printf '# 敬語ボタン %s\n\n最新の改善と修正を含むアップデートです。\n' \
              "$VERSION" > "$NOTES_FILE"
          fi
          cp "$NOTES_FILE" "$APPCAST_DIR/$APP_NAME-$VERSION.md"
          if curl --fail --silent --show-error \
            https://itsukison.github.io/KeigoDesktop/appcast.xml \
            --output "$APPCAST_DIR/appcast.xml"; then
            echo "Updating the existing appcast"
          else
            echo "Creating the first appcast"
          fi
          "$GENERATE_APPCAST" \
            --ed-key-file "$SPARKLE_KEY_PATH" \
            --download-url-prefix "https://github.com/itsukison/KeigoDesktop/releases/download/$TAG/" \
            --embed-release-notes \
            --maximum-deltas 0 \
            --maximum-versions 0 \
            --link https://github.com/itsukison/KeigoDesktop \
            -o "$APPCAST_DIR/appcast.xml" \
            "$APPCAST_DIR"
          xmllint --noout "$APPCAST_DIR/appcast.xml"
          grep -q 'sparkle:edSignature=' "$APPCAST_DIR/appcast.xml"
          grep -q "$APP_NAME-$VERSION.zip" "$APPCAST_DIR/appcast.xml"
          cp "$NOTES_FILE" "$RUNNER_TEMP/release-notes.md"
          PAGES_DIR="$RUNNER_TEMP/pages"
          mkdir -p "$PAGES_DIR"
          cp "$APPCAST_DIR/appcast.xml" "$PAGES_DIR/appcast.xml"
          echo "APPCAST_DIR=$APPCAST_DIR" >> "$GITHUB_ENV"
          echo "PAGES_DIR=$PAGES_DIR" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "$DMG_PATH" \
            "$UPDATE_ZIP" \
            --target "$GITHUB_SHA" \
            --title "敬語ボタン $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Retain debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: KeigoButtonMac-${{ inputs.version }}-dSYMs
          path: ${{ env.ARCHIVE_PATH }}/dSYMs
          if-no-files-found: error
          retention-days: 90

      - name: Upload appcast for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Remove temporary keychain and credentials
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f \
            "${NOTARY_KEY_PATH:-}" \
            "${SPARKLE_KEY_PATH:-}" \
            "$RUNNER_TEMP/developer-id.p12"

  deploy-appcast:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
