<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7fc"/>
      <stop offset="0.55" stop-color="#efecfa"/>
      <stop offset="1" stop-color="#d8d3ef"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="0%" r="82%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#463fa6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="url(#canvas)"/>
  <rect width="720" height="440" fill="url(#light)"/>
  <ellipse cx="108" cy="390" rx="184" ry="104" fill="#c8c1e8" opacity="0.38" filter="url(#soft)"/>
  <ellipse cx="660" cy="360" rx="150" ry="120" fill="#ffffff" opacity="0.52" filter="url(#soft)"/>

  <text x="360" y="62" text-anchor="middle" fill="#25221d"
        font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="24" font-weight="600"
        letter-spacing="-0.4">敬語ボタンをインストール</text>
  <text x="360" y="90" text-anchor="middle" fill="#6a6967"
        font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="13" font-weight="400">左のアイコンを「Applications」へドラッグしてください</text>

  <path d="M304 236 C342 205 383 205 421 236" fill="none" stroke="#463fa6"
        stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <path d="M410 226 L422 236 L407 240" fill="none" stroke="#463fa6"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="196" text-anchor="middle" fill="#463fa6"
        font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="12" font-weight="600">ドラッグしてインストール</text>

  <rect x="250" y="364" width="220" height="32" rx="16" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff"/>
  <text x="360" y="385" text-anchor="middle" fill="#6a6967"
        font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="11">macOS 14 以降 · Appleによる公証済み</text>
</svg>
